[build-system]
requires = ["hatchling>=1.27,<2", "editables>=0.5,<1"]
build-backend = "hatchling.build"

[project]
name = "architectural-modeling-workflow"
version = "0.1.0"
description = "Stage-aware architectural modeling tools for SketchUp and Blender"
requires-python = ">=3.12,<3.13"
license = "MIT AND GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*"]
readme = "README.md"
dependencies = ["mcp==2.3.0", "numpy>=2,<3", "shapely>=2.1,<3", "trimesh>=4.10,<5", "manifold3d>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "PyYAML>=6,<7"]

[project.scripts]
amw = "amw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amw"]

[tool.hatch.build.targets.wheel.force-include]
"adapters" = "amw/bundled/adapters"
"skills" = "amw/bundled/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
