name: Core and protocol
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python skills/architectural-modeling-workflow/scripts/test_model_baseline.py
      - run: python -m build
      - run: python scripts/package_release.py
      - run: python scripts/verify_release.py
